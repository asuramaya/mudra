name: signing-sync
# Enforces the sync-signers invariant on mudra's OWN anchor: packaging/
# release-signing/allowed_signers must always be either (a) empty — the
# pre-arming shipping state, verification inert — or (b) well-formed lines
# that all agree with each other. "Same anchor everywhere on the line" is a
# CHECKED invariant here, not a convention. No embedded install.sh twin to
# compare — mudra has none (docs/ARCHITECTURE.md's Standard exemptions
# table) — so this check is shorter than a pill's by exactly that section.
#
# The canonical key home lives wherever your own `mudra init` (or
# MUDRA_KEY_HOME) points — outside every repo, never committed, never
# reachable by a CI runner. So this check is deliberately INTERNAL-
# CONSISTENCY ONLY: it can confirm the anchor is well-formed, but it cannot
# confirm it still matches your actual canonical keys — that comparison
# only ever happens locally, via `make sync-signers` itself. It also can't
# know how many keys you've configured (EXPECTED_KEYS) or what namespace
# tag you use, so it checks structure and internal agreement, not exact
# counts or a hardcoded namespace string.

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify anchor is well-formed
        run: |
          python3 - <<'PYEOF'
          import re
          import sys

          anchor = open("packaging/release-signing/allowed_signers").read()

          if not anchor.strip():
              print("anchor is UNARMED (empty) — pre-signing shipping state. OK")
              sys.exit(0)

          print("anchor is ARMED — checking internal consistency.")
          lines = [ln for ln in anchor.split("\n") if ln.strip()]
          line_re = re.compile(
              r'^mudra namespaces="mudra-release(?:,\S+)?" '
              r'\S+ \S+ \S+$')
          namespaces = set()
          for ln in lines:
              if not line_re.match(ln):
                  sys.exit(f"malformed allowed_signers line: {ln!r}")
              namespaces.add(re.search(r'namespaces="([^"]+)"', ln).group(1))
          if len(namespaces) != 1:
              sys.exit(f"anchor lines disagree on namespace: {sorted(namespaces)}")
          print(f"{len(lines)} well-formed line(s), consistent namespace, OK")
          PYEOF
