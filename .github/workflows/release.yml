name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < packaging/VERSION)"
          echo "tag=${tag} VERSION=${file}"
          if [ "${tag}" != "${file}" ]; then
            echo "::error::tag ${tag} does not match VERSION ${file}"
            exit 1
          fi

      - name: Refuse to tag while the signing anchor is empty
        run: |
          # A tag's tree is exactly what `git archive` ships in the tarball
          # below -- if packaging/release-signing/allowed_signers is empty
          # AT TAG TIME, the tarball ships a permanently empty anchor,
          # forever, because a sealed release is never re-cut. Safe for a
          # repo that armed long ago (every tag since captures a populated
          # anchor) but not for a first-ever release: arming must happen
          # BEFORE the tag that ships it, never after, never bundled into
          # the seal step (docs/RELEASING.md's three-step order). This
          # guard exists because a documented rule is not an enforced one —
          # gestalt hit the identical drafting mistake independently
          # (Fulcrum, msg 2910) and this is that fix, ported.
          if [ ! -s packaging/release-signing/allowed_signers ]; then
            echo "::error::packaging/release-signing/allowed_signers is empty at this tag." \
                 "Arming (make sync-signers, operator's hand, their key home) must happen" \
                 "BEFORE tagging, never after. Delete this tag, arm, re-tag."
            exit 1
          fi

      - name: Build release tarball
        run: |
          # .gitattributes export-ignore keeps CI/dev files out of the tarball.
          # --prefix=mudra/: extraction hygiene doctrine (RELEASE.md) — every
          # tarball extracts to exactly one named directory, never bare into
          # the caller's CWD. No .deb: mudra is not a pill (RELEASE.md's
          # artifact ruling is scoped to the six pills) and has no
          # install.sh/uninstall.sh (docs/ARCHITECTURE.md's Standard
          # exemptions) — a stdlib-only Python file plus two make targets has
          # nothing for a .deb to package differently from the tarball.
          git archive --format=tar.gz --prefix=mudra/ -o mudra.tar.gz HEAD
          sha256sum mudra.tar.gz > SHA256SUMS
          echo "--- contents ---"
          tar -tzf mudra.tar.gz
          echo "--- manifest ---"
          cat SHA256SUMS

      # No signing step here, deliberately: mudra's own desk trusts an SSH
      # signature (ssh-keygen -Y verify) against a key pinned INSIDE
      # packaging/release-signing/allowed_signers, precisely so that this CI
      # (or the GitHub account behind it) is not the trust root. A
      # secret/hardware key living in Actions secrets would let anyone who
      # compromises the account or the workflow sign whatever they just
      # pushed — that defeats the entire scheme, for mudra exactly as for
      # every repo mudra itself seals. The release ships UNSIGNED from here;
      # the operator signs the manifest's exact published bytes BY HAND,
      # offline, with the physical FIDO2 key, same ceremony as any other
      # card on mudra's own desk — including, recursively, this one.

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: if the release was already created by hand (e.g. with
          # release notes written ahead of the tag push), attach/replace the
          # build assets on it instead of failing on "tag already exists".
          assets=(mudra.tar.gz SHA256SUMS)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            # Notes come from docs/CHANGELOG.md, never --generate-notes: a
            # human wrote that entry, and a commit dump is not release notes.
            # If the section is missing, refuse the release instead of
            # falling back, so a forgotten CHANGELOG entry is loud rather
            # than silent.
            ver="${GITHUB_REF_NAME#v}"
            awk -v v="${ver}" 'BEGIN{f=0}
              /^## / { if (f) exit; if (index($0, v)) { f=1; print; next } }
              f { print }' docs/CHANGELOG.md > RELEASE_NOTES.md
            if [ ! -s RELEASE_NOTES.md ]; then
              echo "::error::no docs/CHANGELOG.md section for ${ver}; add one before tagging"
              exit 1
            fi
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --title "mudra ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md
          fi
